name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DUCKDB_PATH: /tmp/ded-ci.duckdb
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard:${{ github.workspace }}
        run: python -m compileall -q api pipeline tests scripts
      - name: Run offline regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard:${{ github.workspace }}
        run: pytest -q
      - name: Build synthetic database
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard:${{ github.workspace }}
        run: python scripts/build_ci_fixture_db.py
      - name: Build and test dbt models
        working-directory: ecommerce_project
        env:
          DBT_PROFILES_DIR: .
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard:${{ github.workspace }}
        run: dbt build
